root = "."
tmp_dir = "tmp"
env_files = []

[build]
cmd = "go build -buildvcs=false -o ./tmp/api ./cmd/api"
entrypoint = ["./tmp/api"]
include_ext = ["go", "sql"]
include_file = ["go.mod", "go.sum", "go.work", "go.work.sum", "docs/openapi.json", "docs/index.html", "docs/swagger-init.js"]
exclude_dir = [".git", "bin", "tmp", "vendor", "docker", "secrets"]
exclude_regex = ["_test\\.go$"]
exclude_unchanged = true
delay = 500
stop_on_error = true
send_interrupt = true
kill_delay = "20s"
log = "build-errors.log"

[log]
time = true

[misc]
clean_on_exit = false

[screen]
clear_on_rebuild = false
